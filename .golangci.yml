version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        conformance-test:
          files:
            - '**/pkg/datastoreconformancetest/**'
          allow:
            - github.com/cinode/go-datastore/pkg/
            - github.com/cinode/go-common/blob$
            - github.com/cinode/go-common/picotestify/
            - github.com/cinode/go-testvectors/testvectors$
            - bytes$
            - context$
            - crypto/ed25519$
            - crypto/sha256$
            - errors$
            - fmt$
            - io$
            - sync$
            - testing$
        main:
          files:
            - $all
            - '!$test'
            - '!**/pkg/datastore/testutils/generate/main.go'
            - '!**/pkg/datastoreconformancetest/**'
          allow:
            - github.com/cinode/go-datastore/pkg
            - github.com/cinode/go-common/blob$
            - github.com/cinode/go-common/cutl$
            - golang.org/x/crypto/chacha20$
            - bytes$
            - context$
            - crypto/cipher$
            - crypto/ed25519$
            - crypto/sha256$
            - crypto/subtle$
            - encoding/binary$
            - encoding/hex$
            - errors$
            - fmt$
            - hash$
            - io$
            - string$
            - sync$
        tests:
          files:
            - $test
          allow:
            - github.com/cinode/go-datastore/pkg
            - github.com/cinode/go-common/blob$
            - github.com/cinode/go-common/picotestify/
            - github.com/cinode/go-testvectors/testvectors$
            - golang.org/x/crypto/chacha20$
            - bytes$
            - context$
            - crypto/ed25519$
            - crypto/rand$
            - crypto/sha256$
            - errors$
            - fmt$
            - io$
            - math/rand$
            - sort$
            - testing$
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    govet:
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - revive
        path: _test\.go
        text: unused-parameter
      - linters:
          - govet
        text: 'shadow: declaration of "(err|ctx)" shadows declaration at'
    paths:
      - testvectors
      - scripts
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - testvectors
      - scripts
      - third_party$
      - builtin$
      - examples$
